<!DOCTYPE html>
<html lang="{{ default .Site.Language.Lang .Site.LanguageCode  }}" dir="{{ default "ltr" .Site.Language.LanguageDirection }}">
    <head>{{ partial "docs/html-head" . }}{{- $rooted := .Page.Site.BaseURL }}
        <link rel="stylesheet" href="{{$rooted}}.images/other/misc/taxonomies/chess/index.css">
        <script src="{{$rooted}}.images/other/misc/taxonomies/chess/jquery.js"></script>
        <script src="{{$rooted}}.images/other/misc/taxonomies/chess/vschess.js"></script>
    </head>
    <body dir="{{ default "ltr" .Site.Language.LanguageDirection }}">
        <main><input class='toggle' id='darkmode-toggle' type='checkbox' tabindex="-1"></main>
        <div class="manual" style="padding-top:80px;">
            <div class="center">
                <div class="top-controls">
                    <label for="categorySelect">选择棋谱:</label>
                    <select style="margin-bottom: 10px; margin-right: 10px;" id="categorySelect"></select>
                    <label for="gameSelect">选择棋局:</label>
                    <select style="margin-bottom: 10px" id="gameSelect"></select>
                    <button id="copyRecipeLink">复制棋局链接</button>
                    <button id="chessdb">云库</button>
                </div>
                <!-- 创建一个空白棋盘 -->
                <div class="vschess"></div>
                <script>
                    const generateUUID = () => {
                        return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
                            (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
                        );
                    };
                    function parseQuery(query) {
                        var params = {};
                        query = query.trim().replace(/^(\?|#|&)/, '');
                        if (!query) { return params; }
                
                        query.split('&').forEach(function (param) {
                            var parts = param.replace(/\+/g, ' ').replace(/#.*/, '').split('=');
                            params[parts[0]] = parts[1] && decodeURIComponent(parts[1]);
                        });
                        return params;
                    }

                    const recipeConfig = {
                        "JJ象棋-单骑绝尘"   : "recipe-jj-01.txt",
                        "抖音解说" : "recipe-dy-01.txt",
                    };

                    var chessboard;
                    $(document).ready(function() {
                        path = location.href;
                        var query = '', queryIndex = path.indexOf('?');
                        if (queryIndex >= 0) query = path.slice(queryIndex + 1);
                        var params = parseQuery(query);

                        var recipe = $('#categorySelect');
                        $.each(recipeConfig, function(categoryName, fileNames) {
                            let item = $('<option>', { value: fileNames, text: categoryName }).appendTo(recipe);
                            if(categoryName == params.recipe) item.prop('selected', true);
                        });
                        if(!params.recipe){
                            const randomIndex = Math.floor(Math.random() * $('#categorySelect option').length);
                            recipe.prop('selectedIndex', randomIndex);
                        } else {params.recipe = '';}
                        recipe.change(function() { processRecipe(params); });
                        processRecipe(params);

                        $('#copyRecipeLink').click(function(){
                            var selectedText = path.slice(0, queryIndex) + '?recipe=' + $('#categorySelect option:selected').text() + '&option=' + $('#gameSelect option:selected').text();
                            navigator.clipboard.writeText(selectedText);
                        });

                        $('#chessdb').click(function(){
                            if(chessboard) {
                                var currentFen = chessboard.getCurrentFen().split(' ');
                                const fen = currentFen[0] + '_' + currentFen[1];
                                console.log(fen);
                                window.open('https://www.chessdb.cn/query/?' + fen, '_blank');
                            }
                        });
                    });

                    function processRecipe(params){
                        var selectedRecipe = $('#categorySelect').val();
                        $.ajax({
                            url: "{{$rooted}}.images/other/misc/taxonomies/chess/" + selectedRecipe,
                            method: 'GET',
                            success: function(data) { processData(data, params);},
                            error: function(error) { console.error('Error fetching the data:', error);}
                        });
                    }

                    function processData(data, params) {
                        var parts = data.split(/^-{3,}$[\n]+/m)
                        let games = {};
                    
                        parts.forEach(part => {
                            const titleMatch = part.match(/Title ">?(.*?)<?"/);
                            let title;
                            if (titleMatch && titleMatch[1]) {title = titleMatch[1];}
                            else { title = generateUUID(); }
                            games[title] = part;
                        });
                    
                        const selectElement = $('#gameSelect'); selectElement.empty();
                        $.each(games, function(title, content) { 
                            let item = $('<option>', {value: content, text: title}).appendTo(selectElement); 
                            if(title == params.option) item.prop('selected', true);
                        });
                        if(!params.option){
                            const randomIndex = Math.floor(Math.random() * $('#gameSelect option').length);
                            selectElement.prop('selectedIndex', randomIndex);
                        }else{ params.option = '';}
                        //selectElement.trigger('change');

                        selectElement.change(function() { initChess();});
                        
                        initChess();
                    }

                    function initChess(){
                        if(chessboard) chessboard.unload();
                        const gameSelect = $('#gameSelect');
                        // https://www.xiaxiangqi.com/vschess/manual.html
                        vschessFields = {
                            ChineseChar: { Piece: "車馬相仕帥炮兵車馬象士將砲卒" },
                            style: "default",
                            //defaultTab: "edit",
                            defaultTab: "comment",
                            //turn: vschess.code.turn.round,
                            playGap: 15,
                            cloudApi: "",
                        }
                        function loadFinish() { 
                            this._.exportFormat = 'DhtmlXQ';
                            $('select.vschess-tab-body-export-format').prop('selectedIndex', 4);
                            if(gameSelect.val()){ this.loadRecipe(gameSelect.val()); }

                            const moveList = $('.vschess-move-select-list');
                            if (moveList) { 
                                moveList[0].style.setProperty('--blur-mask-view-height', `${moveList.prop('scrollHeight')}px`);
                                moveList.on('click', function(e) { this.classList.toggle('blur-mask'); });
                            }
                        }
                        const fieldMatch = gameSelect.val().match(/Field ">?(.*?)<?"/);
                        if (fieldMatch && fieldMatch[1]) {
                            const configFields = (new Function("return " + fieldMatch[1]))();
                            vschessFields = { ...vschessFields, ...configFields };
                        }
                        vschessFields.loadFinish = loadFinish;
                        chessboard = new vschess.load(".vschess", vschessFields);
                    }
                </script>
            </div>
        </div>
        {{ partialCached "partials/docs/badge.html" . }}
    </body>
</html>
